name: scripts
on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/**
  pull_request:
    paths:
      - .github/scripts/**

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - run: npm install
      - run: npm test
